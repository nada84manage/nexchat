<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChat - Secure Edition</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
            --disabled: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { width: 100%; height: 100vh; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }

        .container { width: 100vw; height: 100vh; background: var(--bg-card); display: flex; overflow: hidden; position: relative; }

        /* 認証画面 */
        #authScreen { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: var(--bg-dark); position: absolute; top: 0; left: 0; z-index: 10; }
        .auth-box { width: 100%; max-width: 400px; background: var(--bg-card); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--border); }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }

        .tabs { display: flex; margin-bottom: 1.5rem; background: var(--bg-dark); border-radius: 8px; padding: 4px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 6px; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
        .tab.active { background: var(--primary); color: white; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .form-group input { width: 100%; padding: 12px 65px 12px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        .toggle-password { position: absolute; right: 8px; background: var(--border); border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-weight: 600; padding: 6px 10px; border-radius: 6px; }
        .msg-box { font-size: 0.85rem; margin-bottom: 1rem; text-align: center; min-height: 1.2rem; }
        .error { color: var(--error); }
        .success { color: var(--success); }

        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: var(--disabled); cursor: not-allowed; }

        /* チャット画面 */
        #chatScreen { width: 100%; height: 100%; display: none; background: var(--bg-dark); position: absolute; top: 0; left: 0; z-index: 5; }
        .chat-layout { width: 100%; height: 100%; display: flex; }
        .sidebar { width: 320px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .user-profile { padding: 1.2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.5); }
        .room-list { flex: 1; overflow-y: auto; }
        .room-item { padding: 1rem 1.2rem; display: flex; align-items: center; gap: 12px; cursor: pointer; background: rgba(99, 102, 241, 0.1); border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
        .chat-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 1.1rem; background: var(--bg-card); }
        
        .chat-messages { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }

        /* LINE風メッセージのレイアウト */
        .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; }
        .message-row.incoming { align-self: flex-start; }
        .message-row.outgoing { align-self: flex-end; flex-direction: row-reverse; }

        /* 吹き出し */
        .message-bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-break: break-all; }
        .message-row.incoming .message-bubble { background: var(--border); color: white; border-bottom-left-radius: 2px; }
        .message-row.outgoing .message-bubble { background: var(--primary); color: white; border-bottom-right-radius: 2px; }

        /* メタ情報（既読・時刻） */
        .message-meta { display: flex; flex-direction: column; align-items: flex-end; font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; margin-bottom: 2px; }
        .read-status { color: var(--primary); font-weight: 600; margin-bottom: 2px; }
        .message-time { font-size: 0.65rem; }

        .chat-input-area { padding: 1.2rem 1.5rem; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; gap: 12px; }
        .chat-input-area input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white; font-size: 1rem; }
        .chat-input-area input:focus { outline: none; border-color: var(--primary); }

        .logout-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 600; }
        .logout-btn:hover { color: var(--error); }
    </style>
</head>
<body>

    <div class="container">
        <div id="authScreen">
            <div class="auth-box">
                <div class="auth-header">
                    <h1>NexChat</h1>
                    <p style="color: var(--text-muted);">セキュアチャットシステム</p>
                </div>
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">ログイン</div>
                    <div class="tab" onclick="switchTab('signup')">新規登録</div>
                </div>
                <div id="statusMsg" class="msg-box"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>メールアドレス</label>
                        <input type="email" id="loginEmail" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>パスワード</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" required placeholder="••••••••">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">表示</button>
                        </div>
                    </div>
                    <button type="submit" class="btn">ログイン</button>
                </form>

                <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>ユーザー名</label>
                        <input type="text" id="signupName" required placeholder="山田 太郎">
                    </div>
                    <div class="form-group">
                        <label>メールアドレス</label>
                        <input type="email" id="signupEmail" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>パスワード (6文字以上)</label>
                        <div class="input-wrapper">
                            <input type="password" id="signupPassword" required minlength="6" placeholder="••••••••">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signupPassword', this)">表示</button>
                        </div>
                    </div>
                    <button type="submit" class="btn">アカウント作成</button>
                </form>
            </div>
        </div>

        <div id="chatScreen">
            <div class="chat-layout">
                <div class="sidebar">
                    <div class="user-profile">
                        <span id="currentUserName" style="font-weight: 600;"></span>
                        <button class="logout-btn" onclick="logout()">ログアウト</button>
                    </div>
                    <div class="room-list">
                        <div class="room-item">
                            <div class="avatar">DEV</div>
                            <div>
                                <div style="font-weight: 600;">NexChat デベロッパー</div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">オンライン</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="chat-main">
                    <div class="chat-header">
                        <span>NexChat デベロッパー (公式サポート)</span>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="messageInput" placeholder="メッセージを入力..." oninput="handleInput()" onkeypress="checkEnter(event)">
                        <button id="sendBtn" class="btn" onclick="sendMessage()" style="width: 100px;" disabled>送信</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = localStorage.getItem('nexchat_current_session');
            if (loggedInUser) {
                currentUser = JSON.parse(loggedInUser);
                showChatScreen(currentUser.name);
            }
        });

        function togglePasswordVisibility(fieldId, btnElement) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === 'password') {
                inputField.type = 'text';
                btnElement.innerText = '非表示';
            } else {
                inputField.type = 'password';
                btnElement.innerText = '表示';
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('statusMsg').innerText = '';
            if (type === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('signupForm').style.display = 'none';
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('signupForm').style.display = 'block';
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const statusEl = document.getElementById('statusMsg');

            try {
                const response = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || '登録に失敗しました');

                statusEl.className = 'msg-box success';
                statusEl.innerText = '登録成功！ログインしてください。';
                setTimeout(() => switchTab('login'), 1500);
            } catch (error) {
                statusEl.className = 'msg-box error';
                statusEl.innerText = error.message || '通信エラー';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const statusEl = document.getElementById('statusMsg');

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'ログインに失敗しました');

                currentUser = { name: data.user.name, email };
                localStorage.setItem('nexchat_current_session', JSON.stringify(currentUser));
                showChatScreen(data.user.name);
            } catch (error) {
                statusEl.className = 'msg-box error';
                statusEl.innerText = error.message || '通信エラー';
            }
        }

        function showChatScreen(userName) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'block';
            document.getElementById('currentUserName').innerText = userName;
            loadMessages();
            setInterval(loadMessages, 3000); // 3秒ごとに同期
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/messages`);
                const messages = await response.json();
                if (Array.isArray(messages)) {
                    renderMessages(messages);
                }
            } catch (e) {
                console.error('メッセージ取得失敗', e);
            }
        }

        function renderMessages(messages) {
            const chatMessages = document.getElementById('chatMessages');
            const isAtBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 50;
            
            chatMessages.innerHTML = '';
            
            messages.forEach(msg => {
                const isMyMessage = msg.sender === currentUser.name;
                
                const row = document.createElement('div');
                row.className = `message-row ${isMyMessage ? 'outgoing' : 'incoming'}`;

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.innerText = msg.text;

                const meta = document.createElement('div');
                meta.className = 'message-meta';
                
                if (isMyMessage) {
                    meta.innerHTML = `
                        <div class="read-status">${msg.read || '既読'}</div>
                        <div class="message-time">${msg.time}</div>
                    `;
                } else {
                    meta.innerHTML = `
                        <div class="message-time" style="margin-top: auto;">${msg.time}</div>
                    `;
                }

                row.appendChild(bubble);
                row.appendChild(meta);
                chatMessages.appendChild(row);
            });

            if (isAtBottom || chatMessages.children.length <= 3) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function handleInput() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = input.value.trim().length === 0;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const now = new Date();
            const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            try {
                await fetch(`${API_URL}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: currentUser.name, text, time })
                });
                loadMessages();
            } catch (e) {
                console.error('送信失敗', e);
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const sendBtn = document.getElementById('sendBtn');
                if (!sendBtn.disabled) {
                    sendMessage();
                }
            }
        }

        function logout() {
            localStorage.removeItem('nexchat_current_session');
            location.reload();
        }
    </script>
</body>
</html>
